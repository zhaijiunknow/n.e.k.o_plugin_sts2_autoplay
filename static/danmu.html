<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS2 弹幕信息</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
/* 确保 hidden 属性生效（display:flex 会覆盖原生 hidden） */
[hidden] { display: none !important; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif; background:#15171c; color:#e8eaf0; padding:24px; }
.wrap { max-width:460px; margin:0 auto; }
h1 { font-size:20px; margin-bottom:4px; }
p.sub { color:#9aa2b1; font-size:12px; margin-bottom:20px; }
a { color:#7fd4ff; font-size:12px; text-decoration:none; }
.card { background:#1e222b; border:1px solid #2b303c; border-radius:10px; padding:18px; margin-bottom:14px; }
.card h3 { font-size:13px; margin-bottom:10px; color:#7fd4ff; }
.item { display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px solid #262b36; }
.item:last-child { border-bottom:none; }
.item .k { color:#9aa2b1; }
.item .v { font-family: Consolas, monospace; color:#4ade80; }
.item .v.dim { color:#9aa2b1; }
.item .v.ok { color:#4ade80; }
.item .v.bad { color:#fbbf24; }
.hint { font-size:12px; color:#fbbf24; background:#332b1a; border-radius:6px; padding:8px 10px; margin-top:8px; }
.hint code { background:#262b36; padding:1px 5px; border-radius:4px; }
.card-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.card-head h3 { margin:0; color:#7fd4ff; }
.method-tag {
    display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600;
}
.tag-qt { background:rgba(58,160,255,.14); color:#7fd4ff; }
.tag-shell { background:rgba(34,197,94,.14); color:#4ade80; }
.back-btn {
    display:inline-block; background:#2b303c; color:#e8eaf0; border:1px solid #3a4150;
    border-radius:6px; padding:6px 14px; font-size:12px; text-decoration:none; transition:.15s;
}
.back-btn:hover { background:#3aa0ff; color:#fff; border-color:#3aa0ff; }
.row { display:flex; gap:10px; align-items:center; }
button { border:none; border-radius:6px; padding:8px 18px; font-size:13px; cursor:pointer; }
button.primary { background:#3aa0ff; color:#fff; }
button.primary:hover { background:#2f8ce6; }
button.danger { background:#e86a3a; color:#fff; }
button.danger:hover { background:#d1572b; }
button.ghost { background:#262b36; color:#9aa2b1; border:1px solid #3a4150; }
button.ghost:hover { color:#e8eaf0; border-color:#3aa0ff; }
.field { margin-bottom:12px; }
.field:last-child { margin-bottom:0; }
.field label { display:block; font-size:12px; color:#9aa2b1; margin-bottom:5px; }
.field input, .field select {
    width:100%; background:#262b36; border:1px solid #2b303c; border-radius:6px;
    color:#e8eaf0; padding:8px 10px; font-size:13px; box-sizing:border-box;
}
.field input:focus, .field select:focus { outline:none; border-color:#3aa0ff; }
.field .hint { font-size:11px; color:#7a8291; margin-top:4px; }
#config-msg { font-size:12px; color:#4ade80; }
button:disabled { opacity:0.5; cursor:not-allowed; }
#overlay-msg { font-size:12px; color:#9aa2b1; }
</style>
</head>
<body>
<div class="wrap">
    <div style="margin-bottom:12px"><a class="back-btn" href="index.html">← 返回</a></div>
    <h1>STS2 弹幕信息</h1>
    <p class="sub">两种弹幕方式：Qt 透明浮层 / 壳包装</p>

    <div class="card">
        <div class="card-head"><span class="method-tag tag-qt">Qt 透明窗</span><h3>弹幕浮层</h3></div>
        <div class="item"><span class="k">Qt 浮层版本</span><span class="v" id="qt-version">—</span></div>
        <div class="item"><span class="k">PyQt6 依赖</span><span class="v" id="pyqt6-status">检测中…</span></div>
        <div id="pyqt6-hint" class="hint" hidden></div>
        <div class="row" style="margin-top:14px">
            <button id="start-btn" class="primary" onclick="overlayAction('start')">启动浮层</button>
            <button id="stop-btn" class="danger" onclick="overlayAction('stop')">停止浮层</button>
            <span id="overlay-msg"></span>
        </div>
        <div id="pyqt6-install-row" class="row" style="margin-top:10px" hidden>
            <button id="install-pyqt6-btn" class="ghost" onclick="installPyqt6()">一键安装 PyQt6</button>
            <span id="install-msg"></span>
        </div>
    </div>

    <div class="card">
        <h3>弹幕配置</h3>
        <div class="field">
            <label>自动贴合游戏窗口标题（推荐；如 Slay the Spire，浮层自动对齐游戏窗口位置）</label>
            <input id="f-window" type="text" placeholder="Slay the Spire">
        </div>
        <div class="field">
            <label>自定义窗口尺寸 WxH+X+Y（可选；留空则贴合游戏窗口，两者都空 = 全屏）</label>
            <input id="f-rect" type="text" placeholder="1600x900+0+0">
            <div class="hint">格式：宽x高+左上角X+左上角Y。填了此值则优先用自定义尺寸。</div>
        </div>
        <div class="field">
            <label>滚动速度（px/s，0 = 默认 180）</label>
            <input id="f-speed" type="number" step="10" min="0" placeholder="180">
        </div>
        <div class="field">
            <label>字号（0 = 默认 15）</label>
            <input id="f-font" type="number" step="1" min="0" placeholder="15">
        </div>
        <div class="field">
            <label>可显示弹幕高度（% 窗口高度，默认 30，靠顶）</label>
            <input id="f-height" type="number" step="5" min="5" max="100" placeholder="30">
            <div class="hint">弹幕只在窗口上方高度百分比内滚动，其余区域留空。</div>
        </div>
        <div class="field">
            <label>弹幕密度（50-200%，默认 100）</label>
            <input id="f-density" type="number" step="10" min="50" max="200" placeholder="100">
            <div class="hint">控制每条弹幕事件推送的条数，数值越大弹幕越密。</div>
        </div>
        <div class="field">
            <label>顶部弹幕模式</label>
            <select id="f-top">
                <option value="standard">标准（旁白按概率置顶）</option>
                <option value="none">关闭（全部滚动）</option>
                <option value="all">全部置顶</option>
            </select>
        </div>
        <div class="row" style="margin-top:14px">
            <button class="primary" onclick="saveConfig()">保存配置</button>
            <span id="config-msg"></span>
        </div>
    </div>

    <div class="card">
        <div class="card-head"><span class="method-tag tag-shell">壳 / Web</span><h3>壳包装弹幕</h3></div>
        <div class="item"><span class="k">壳包装版本 (SDK)</span><span class="v" id="sdk-version">—</span></div>
        <div class="item"><span class="k">插件版本</span><span class="v" id="plugin-version">—</span></div>
    </div>
</div>

<script>
const PLUGIN_ID = 'sts2_autoplay';
// 与 qt_overlay.py 的 QT_OVERLAY_VERSION 保持一致
const QT_OVERLAY_VERSION = '1.0.0';

document.getElementById('qt-version').textContent = QT_OVERLAY_VERSION;

async function loadVersions() {
    // 壳包装版本：插件 server SDK 版本
    try {
        const res = await fetch('/server/info', { cache: 'no-store' });
        if (res.ok) {
            const d = await res.json();
            document.getElementById('sdk-version').textContent = d.sdk_version || '—';
        }
    } catch (_) { /* 忽略 */ }

    // 插件版本：插件配置
    try {
        const res = await fetch(`/plugin/${PLUGIN_ID}/config`, { cache: 'no-store' });
        if (res.ok) {
            const d = await res.json();
            const ver = (d.config && d.config.plugin && d.config.plugin.version) || '';
            document.getElementById('plugin-version').textContent = ver || '—';
        }
    } catch (_) { /* 忽略 */ }
}

async function waitForRun(runId, retries) {
    const max = retries || 25;
    for (let i = 0; i < max; i++) {
        try {
            const res = await fetch(`/runs/${runId}`, { cache: 'no-store' });
            const d = await res.json();
            if (d.stage === 'done' || d.status === 'succeeded' || d.status === 'failed') return d;
        } catch (_) { /* 忽略瞬时失败 */ }
        await new Promise(r => setTimeout(r, 1000));
    }
    return null;
}

async function checkPyqt6() {
    const statusEl = document.getElementById('pyqt6-status');
    const hintEl = document.getElementById('pyqt6-hint');
    statusEl.textContent = '检测中…';
    statusEl.className = 'v';
    hintEl.hidden = true;
    try {
        const create = await fetch('/runs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ plugin_id: PLUGIN_ID, entry_id: 'sts2_overlay_status', args: {} }),
        });
        const created = await create.json();
        if (!created.run_id) throw new Error('run 创建失败');
        const run = await waitForRun(created.run_id);
        if (!run) { statusEl.textContent = '检测超时'; return; }
        const expRes = await fetch(`/runs/${created.run_id}/export`, { cache: 'no-store' });
        const exportData = await expRes.json();
        const item = (exportData.items || [])[0] || {};
        const data = (item.json || {}).data || {};
        const installRow = document.getElementById('pyqt6-install-row');
        if (data.pyqt6_installed) {
            statusEl.textContent = '已安装 ✓';
            statusEl.className = 'v ok';
            hintEl.hidden = true;
            installRow.hidden = true;
        } else {
            statusEl.textContent = '未安装 ✗';
            statusEl.className = 'v bad';
            hintEl.hidden = false;
            hintEl.innerHTML = '点击下方「一键安装 PyQt6」或运行 <code>pip install PyQt6</code>。';
            installRow.hidden = false;
        }
    } catch (err) {
        statusEl.textContent = '检测失败';
        statusEl.className = 'v bad';
    }
}

async function installPyqt6() {
    const btn = document.getElementById('install-pyqt6-btn');
    const msg = document.getElementById('install-msg');
    btn.disabled = true;
    msg.textContent = '安装中…（联网，可能耗时）';
    try {
        const create = await fetch('/runs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ plugin_id: PLUGIN_ID, entry_id: 'sts2_install_pyqt6', args: {} }),
        });
        const created = await create.json();
        if (!created.run_id) throw new Error('run 创建失败');
        const run = await waitForRun(created.run_id);
        if (!run) { msg.textContent = '安装超时'; return; }
        const expRes = await fetch(`/runs/${created.run_id}/export`, { cache: 'no-store' });
        const exportData = await expRes.json();
        const item = (exportData.items || [])[0] || {};
        const data = (item.json || {}).data || {};
        msg.textContent = data.installed ? '安装完成 ✓' : ('安装失败: ' + (data.error || ''));
    } catch (err) {
        msg.textContent = '失败: ' + err;
    } finally {
        btn.disabled = false;
        checkPyqt6(); // 重新检测
    }
}

async function getConfig() {
    const res = await fetch(`/plugin/${PLUGIN_ID}/config`, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    return (d && d.config) || {};
}

async function loadConfig() {
    try {
        const cfg = await getConfig();
        const s = cfg.sts2 || {};
        document.getElementById('f-window').value = s.qt_overlay_window || '';
        document.getElementById('f-rect').value = s.qt_overlay_rect || '';
        document.getElementById('f-speed').value = s.danmu_speed || '';
        document.getElementById('f-font').value = s.danmu_font_size || '';
        document.getElementById('f-height').value = s.danmu_height_percent || 30;
        document.getElementById('f-density').value = s.danmu_density || 100;
        document.getElementById('f-top').value = s.danmu_top_mode || 'standard';
    } catch (_) { /* 加载失败忽略 */ }
}

async function saveConfig() {
    const msg = document.getElementById('config-msg');
    msg.textContent = '保存中…';
    try {
        // 读-改-写：只 PUT sts2 段，避免清空其他配置
        const cfg = await getConfig();
        const s = cfg.sts2 || {};
        s.qt_overlay_window = document.getElementById('f-window').value.trim();
        s.qt_overlay_rect = document.getElementById('f-rect').value.trim();
        s.danmu_speed = Number(document.getElementById('f-speed').value) || 0;
        s.danmu_font_size = Number(document.getElementById('f-font').value) || 0;
        s.danmu_height_percent = Number(document.getElementById('f-height').value) || 30;
        s.danmu_density = Number(document.getElementById('f-density').value) || 100;
        s.danmu_top_mode = document.getElementById('f-top').value;
        const res = await fetch(`/plugin/${PLUGIN_ID}/config`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ config: { sts2: s } }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        msg.textContent = (await res.json()).success ? '已保存（重启浮层生效）' : '保存失败';
    } catch (err) {
        msg.textContent = '保存失败: ' + err;
    }
}

async function overlayAction(action) {
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const msg = document.getElementById('overlay-msg');
    startBtn.disabled = true;
    stopBtn.disabled = true;
    msg.textContent = action === 'start' ? '启动中…' : '停止中…';
    try {
        const entryId = action === 'start' ? 'sts2_overlay_start' : 'sts2_overlay_stop';
        const res = await fetch('/runs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ plugin_id: PLUGIN_ID, entry_id: entryId, args: {} }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        msg.textContent = d.run_id ? (action === 'start' ? '已发起启动' : '已发起停止') : '返回异常';
    } catch (err) {
        msg.textContent = '失败: ' + err;
    } finally {
        startBtn.disabled = false;
        stopBtn.disabled = false;
    }
}

loadVersions();
checkPyqt6();
loadConfig();
</script>
</body>
</html>
