<!DOCTYPE html>
<html lang="zh-CN" class="dm-window-host">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STS2 弹幕浮层</title>
    <!--
      STS2 陪玩点评弹幕浮层 — 弹幕显示页
      数据源：SSE /plugin/sts2_autoplay/ui-api/events（danmaku.js resolveEventsUrl 自动解析）
      内容：STS2 陪玩点评/提醒/建议（插件 danmu_bridge 推入 /ui-api/push）
      集成预留：本页在 Electron 透明浮窗中加载时，body 保持 background:transparent，
      .dm-stage 保持 pointer-events:none（对应 setIgnoreMouseEvents）。
      生产环境可给 <body> 加 hidden 隐藏调试条：<body class="dm-window-host dm-prod">
    -->
    <link rel="stylesheet" href="danmaku.css">
</head>
<body class="dm-window-host">
    <!-- 调试状态条：MVP 阶段展示在线/计数，便于验证；生产集成时整体隐藏 -->
    <div id="dm-debug-bar" class="dm-debug-bar">
        <button id="dm-demo-btn" type="button" class="dm-demo-btn">▶ 自动演示</button>
        <span class="dm-stat">SSE <b id="dm-sse-state">–</b></span>
        <span class="dm-stat">显示 <b id="dm-stat-shown">0</b></span>
        <span class="dm-stat">活跃 <b id="dm-stat-active">0</b></span>
        <span class="dm-stat">去重 <b id="dm-stat-dup">0</b></span>
        <span class="dm-stat">繁忙 <b id="dm-stat-busy">0</b></span>
        <a href="index.html" target="_blank" class="dm-stat" style="color:#7fd4ff;text-decoration:none">控制</a>
    </div>

    <!-- 弹幕舞台：全屏透明层，仅承载滚动 lane -->
    <div id="dm-stage" class="dm-stage"></div>

    <script src="sample_commentary.js"></script>
    <script src="danmaku.js"></script>
</body>
</html>
