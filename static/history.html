<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NekoSpire · 游玩历史</title><link rel="stylesheet" href="ui.css?v=20261127-parameters2"><script src="ui.js?v=20261127-parameters2"></script></head>
<body><div class="wrap"><header class="masthead" id="masthead"></header><main>
<div class="page-heading"><div><div class="eyebrow">EXPEDITION RECORDS / 游玩历史</div><h1><span class="keep">每次攀登，</span><span class="keep">都有回响。</span></h1><p class="sub">回望走过的路线、做出的选择，以及那些值得再想一次的回合。</p></div><span class="chapter" aria-hidden="true">03</span></div>
<div class="stats" id="cards" aria-label="全部历史统计"><div class="card"><div class="k">正在读取记录</div><div class="v">—</div></div></div>
<div class="archive-tools"><input id="search" type="search" placeholder="搜索角色或对局编号…" aria-label="搜索角色或对局编号"><select id="filter-character" aria-label="筛选角色"><option value="">全部角色</option></select><select id="filter-outcome" aria-label="筛选结局"><option value="">全部结局</option><option value="victory">通关</option><option value="defeat">阵亡</option><option value="other">其他</option></select><button id="refresh">刷新记录 ↻</button></div>
<div class="archive-meta" id="status" role="status" aria-live="polite">加载中…</div>
<div class="archive-layout" id="archive-layout"><aside aria-label="对局列表"><div class="archive-list" id="run-list"></div><div class="pagination" id="pagination" hidden><button id="prev" aria-label="上一页">←</button><span id="page-label"></span><button id="next" aria-label="下一页">→</button></div></aside><section id="runs" class="archive-detail" aria-label="所选对局详情"><div class="empty">正在读取历史快照…</div></section></div>
</main><footer class="footer"><span>NEKOSPIRE / 记录每一次出发</span><span>历史快照 · 每局结束后更新</span></footer></div>
<script>
Spire.shell('history');

function fmtTime(ts) {
  if (!ts) return "—";
  try { return new Date(ts * 1000).toLocaleString(); } catch (e) { return "—"; }
}
const esc = Spire.esc;
function outcomeTag(outcome) {
  const label = outcome === "victory" ? "通关" : (outcome === "defeat" ? "阵亡" : (outcome || "未知"));
  const cls = outcome === "victory" ? "victory" : (outcome === "defeat" ? "defeat" : "");
  return '<span class="tag ' + cls + '">' + esc(label) + '</span>';
}

function renderRoute(run) {
  const route = run.route || [];
  if (!route.length) return "";
  // 一行式路线：房间(损血) → 房间(损血) …，让"哪几段掉血"一眼可见。
  const strip = route.map(function (step) {
    const label = step.room || step.screen || "?";
    const lost = Number(step.hp_lost || 0);
    return '<span class="step' + (lost ? "" : " safe") + '">' + esc(label) +
      (lost ? ' <span class="loss">-' + lost + "</span>" : "") + "</span>";
  }).join('<span class="arrow">→</span>');

  const rows = route.map(function (step, i) {
    const gains = [];
    if (step.gold_gained) gains.push("金币+" + esc(step.gold_gained));
    if ((step.cards_gained || []).length) gains.push("卡:" + esc((step.cards_gained || []).join("/")));
    if ((step.relics_gained || []).length) gains.push("遗物:" + esc((step.relics_gained || []).join("/")));
    if ((step.potions_gained || []).length) gains.push("药水:" + esc((step.potions_gained || []).join("/")));
    return "<tr><td>" + (i + 1) + "</td><td>" + esc(step.room || "—") + "</td><td>" + esc(step.floor) +
      "</td><td>" + esc(step.hp_start) + "→" + esc(step.hp_end) +
      "</td><td>" + (step.hp_lost ? '<span class="loss">-' + esc(step.hp_lost) + "</span>" : '<span class="safe">0</span>') +
      "</td><td>" + (gains.length ? gains.join("，") : '<span class="muted">—</span>') + "</td></tr>";
  }).join("");

  return '<div class="box" style="margin-top:10px"><div class="k">路线图（每个房间的损血与收获）</div>' +
    '<div class="route">' + strip + "</div>" +
    '<table class="rooms"><thead><tr><th>#</th><th>房间</th><th>层</th><th>血</th><th>损血</th><th>收获</th></tr></thead><tbody>' +
    rows + "</tbody></table></div>";
}

function renderReview(run) {
  const review = run.review;
  if (!review || !review.compared) return "";
  const pct = function (p) { return p == null ? "" : "（" + Math.round(p * 100) + "%）"; };
  const rows = (review.steps || []).map(function (step) {
    const where = "第" + esc(step.floor) + "层" + (step.round ? " 第" + esc(step.round) + "回合" : "") +
      (step.room ? "<br><span class=\"muted\">" + esc(step.room) + "</span>" : "");
    return "<tr><td>" + where + "</td><td>" + esc(step.chosen) + esc(pct(step.p_chosen)) + "</td><td>" +
      esc(step.recommended) + esc(pct(step.p_recommended)) + "</td><td>" +
      (step.source === "network" ? "策略网络" : "求解器 / 启发式") + "</td></tr>";
  }).join("");
  return '<div class="reflect"><div class="k muted">对照复盘：你亲手打的 ' + esc(review.compared) + " 步里，" +
    esc(review.agreed) + " 步与推荐相同</div>" +
    (review.explanation ? "<div>" + esc(review.explanation) + "</div>" : "") +
    (rows
      ? "<details><summary>差得最多的 " + (review.steps || []).length + " 步</summary>" +
        "<table><thead><tr><th>位置</th><th>你选的</th><th>推荐</th><th>推荐来自</th></tr></thead><tbody>" +
        rows + "</tbody></table></details>"
      : "") +
    "</div>";
}

function renderRun(run) {
  const hp = run.hp || {};
  const heaviest = (run.heaviest || []).map(function (item) {
    // 优先显示房间标识（敌人组合 / 事件 id）：地图随机，"第 N 层"跨局不可复用。
    const where = item.room ? item.room : (esc(item.screen) + " 第" + esc(item.floor) + "层");
    return "<li>" + esc(where) + "：<span class='loss'>-" +
      esc(item.lost) + "</span> (" + esc(item.hp_before) + "→" + esc(item.hp_after) + ")</li>";
  }).join("");
  const lessons = (run.lessons || []).map(function (item) { return "<li>" + esc(item) + "</li>"; }).join("");
  const decisions = (run.decisions || []).map(function (item) {
    return "<tr><td>" + esc(item.step_count) + "</td><td>" + esc(item.screen) + "</td><td><code>" +
      esc(item.action_type) + "</code></td><td>" + esc(item.reason) + "</td></tr>";
  }).join("");

  return '<div class="run">' +
    "<h2>" + outcomeTag(run.outcome) +
      '<span class="tag">' + esc(run.character || "?") + "</span>" +
      '<span class="tag">第' + esc(run.floor) + '层</span>' +
      '<span class="muted">' + esc(fmtTime(run.ended_at)) + "</span>" +
      '<span class="muted">' + esc(run.run_id) + "</span></h2>" +
    '<div class="grid">' +
      '<div class="box"><div class="k">损血合计</div><div class="' + (hp.total_lost === 0 ? "safe" : "") + '">' + esc(hp.total_lost == null ? "—" : hp.total_lost) +
        " 点 / " + esc(hp.loss_events == null ? "—" : hp.loss_events) + " 次</div></div>" +
      '<div class="box"><div class="k">生命</div><div>最低 ' + esc(hp.min_hp == null ? "—" : hp.min_hp) +
        " / " + esc(hp.max_hp == null ? "—" : hp.max_hp) + "，结束 " + esc(hp.final_hp == null ? "—" : hp.final_hp) + "</div></div>" +
      '<div class="box"><div class="k">最痛的几处</div>' + (heaviest ? "<ul>" + heaviest + "</ul>" : '<span class="muted">无记录</span>') + "</div>" +
      '<div class="box"><div class="k">教训</div>' + (lessons ? "<ul>" + lessons + "</ul>" : '<span class="muted">无</span>') + "</div>" +
    "</div>" +
    renderReview(run) +
    (run.reflection ? '<div class="reflect"><div class="k muted">复盘反思（旧版本记录）</div>' + esc(run.reflection) + "</div>" : "") +
    renderRoute(run) +
    (decisions
      ? "<details><summary>做出的选择（" + (run.decisions || []).length + " 步）</summary>" +
        "<table><thead><tr><th>步</th><th>界面</th><th>动作</th><th>理由</th></tr></thead><tbody>" +
        decisions + "</tbody></table></details>"
      : "") +
    "</div>";
}


let historyPayload=null, filtered=[], selectedKey='', currentPage=0;
const PAGE_SIZE=12;
const keyOf=run=>String(run.run_id||'')+'|'+String(run.ended_at||'');
const charName=run=>Spire.characters[Spire.character(run.character)]?.name || run.character || '未知角色';
function render(payload) {
  if(!Array.isArray(payload.runs))throw new Error('历史快照格式不正确');
  historyPayload=payload;
  const s=payload.summary||{};
  document.getElementById('cards').innerHTML=[['记录局数',s.runs??payload.runs.length],['通关',s.victories??0],['阵亡',s.defeats??0],['最深层级',s.best_floor??0],['累计损血',s.total_hp_lost??0]].map(([k,v])=>'<div class="card"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>').join('');
  const select=document.getElementById('filter-character'),previous=select.value;
  select.replaceChildren(new Option('全部角色',''));
  [...new Set(payload.runs.map(run=>run.character||'未知角色'))].sort().forEach(name=>select.add(new Option(Spire.characters[Spire.character(name)]?.name||name,name)));
  if([...select.options].some(o=>o.value===previous))select.value=previous;
  filterRuns(false);
}
function filterRuns(reset=true){
  if(!historyPayload)return;
  const query=document.getElementById('search').value.trim().toLowerCase();
  const character=document.getElementById('filter-character').value;
  const outcome=document.getElementById('filter-outcome').value;
  filtered=historyPayload.runs.filter(run=>{
    const matchesText=(String(run.run_id||'')+' '+charName(run)+' '+String(run.character||'')).toLowerCase().includes(query);
    return matchesText&&(!character||(run.character||'未知角色')===character)&&(!outcome||(outcome==='other'?!['victory','defeat'].includes(run.outcome):run.outcome===outcome));
  }).sort((a,b)=>(Number(b.ended_at)||0)-(Number(a.ended_at)||0));
  if(reset)currentPage=0;
  currentPage=Math.min(currentPage,Math.max(0,Math.ceil(filtered.length/PAGE_SIZE)-1));
  showPage();
}
function showPage(){
  const list=document.getElementById('run-list');list.replaceChildren();
  const visible=filtered.slice(currentPage*PAGE_SIZE,(currentPage+1)*PAGE_SIZE);
  if(!visible.some(run=>keyOf(run)===selectedKey))selectedKey=visible[0]?keyOf(visible[0]):'';
  for(const run of visible){
    const button=document.createElement('button');button.className='run-choice';button.type='button';
    button.setAttribute('aria-pressed',String(keyOf(run)===selectedKey));
    button.setAttribute('aria-controls','runs');
    const art=Spire.art(Spire.character(run.character));
    const outcome=run.outcome==='victory'?'通关':run.outcome==='defeat'?'阵亡':run.outcome||'未知';
    button.innerHTML=(art?'<img alt="" src="'+esc(art)+'">':'<span class="unknown-avatar" aria-hidden="true">◇</span>')+'<span><strong>'+esc(charName(run))+'</strong><small>'+esc(outcome)+' · '+esc(fmtTime(run.ended_at))+'</small></span><span class="floor">'+esc(run.floor??'—')+'<small>FLOOR</small></span>';
    button.addEventListener('click',()=>{
      selectedKey=keyOf(run);
      [...list.children].forEach(el=>el.setAttribute('aria-pressed',String(el===button)));
      showDetail(run);
    });list.append(button);
  }
  const selected=visible.find(run=>keyOf(run)===selectedKey);
  if(selected)showDetail(selected);
  else document.getElementById('runs').innerHTML='<div class="empty"><strong>'+(!historyPayload.runs.length?'旅程尚未落笔':'没有匹配的对局')+'</strong>'+(!historyPayload.runs.length?'每结束一局，插件就会在这里留下记录。':'试试其他角色、结局，或清空搜索。')+'</div>';
  if(!visible.length)list.innerHTML='<div class="empty">暂无记录</div>';
  document.getElementById('pagination').hidden=filtered.length<=PAGE_SIZE;
  document.getElementById('prev').disabled=currentPage===0;
  document.getElementById('next').disabled=(currentPage+1)*PAGE_SIZE>=filtered.length;
  document.getElementById('page-label').textContent=(currentPage+1)+' / '+Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  document.getElementById('status').textContent='显示 '+filtered.length+' / '+historyPayload.runs.length+' 局 · 按结束时间倒序 · 上方统计为全部记录';
}
function showDetail(run){
  const detail=document.getElementById('runs');
  detail.innerHTML=renderRun({...run,character:charName(run)});
  detail.querySelectorAll('table').forEach(table=>{
    const wrap=document.createElement('div');wrap.className='table-scroll';wrap.tabIndex=0;wrap.setAttribute('role','region');wrap.setAttribute('aria-label','可滚动的对局明细表格');
    table.replaceWith(wrap);wrap.append(table);
  });
}
async function load(){
  const status=document.getElementById('status'),refresh=document.getElementById('refresh');
  refresh.disabled=true;status.textContent='正在读取历史快照…';
  try {render(await Spire.request('autoplay_history.json?t='+Date.now()));}
  catch(error){
    status.textContent=historyPayload?'刷新失败，保留上次读取的历史':'读取失败';
    if(!historyPayload){document.getElementById('cards').innerHTML='';document.getElementById('runs').innerHTML='<div class="empty"><strong>还读不到历史快照</strong>'+esc(error.message)+'<br>插件在每局结束时生成记录；首次使用可能尚无历史。</div>';}
    else status.textContent+='：'+error.message;
  }finally{refresh.disabled=false;}
}
document.getElementById('refresh').addEventListener('click',load);
document.getElementById('search').addEventListener('input',()=>filterRuns());
document.getElementById('filter-character').addEventListener('change',()=>filterRuns());
document.getElementById('filter-outcome').addEventListener('change',()=>filterRuns());
document.getElementById('prev').addEventListener('click',()=>{currentPage--;showPage();});
document.getElementById('next').addEventListener('click',()=>{currentPage++;showPage();});
load();
</script></body></html>
