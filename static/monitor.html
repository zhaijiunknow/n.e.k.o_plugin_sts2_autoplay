<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS2 游戏状态监控</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
[hidden] { display: none !important; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif; background:#15171c; color:#e8eaf0; padding:24px; }
.wrap { max-width:720px; margin:0 auto; }
h1 { font-size:20px; margin-bottom:4px; }
p.sub { color:#9aa2b1; font-size:12px; margin-bottom:20px; }
a { color:#7fd4ff; font-size:12px; text-decoration:none; }
.card { background:#1e222b; border:1px solid #2b303c; border-radius:10px; padding:18px; margin-bottom:14px; }
.card h3 { font-size:13px; margin-bottom:10px; color:#7fd4ff; }
.item { display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px solid #262b36; }
.item:last-child { border-bottom:none; }
.item .k { color:#9aa2b1; }
.item .v { font-family: Consolas, monospace; color:#4ade80; }
.item .v.dim { color:#9aa2b1; }
.item .v.bad { color:#fbbf24; }
.hint { font-size:12px; color:#fbbf24; background:#332b1a; border-radius:6px; padding:8px 10px; margin-top:8px; }
.card-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.card-head h3 { margin:0; color:#7fd4ff; }
.method-tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.tag-qt { background:rgba(58,160,255,.14); color:#7fd4ff; }
.tag-shell { background:rgba(34,197,94,.14); color:#4ade80; }
.back-btn { display:inline-block; background:#2b303c; color:#e8eaf0; border:1px solid #3a4150; border-radius:6px; padding:6px 14px; font-size:12px; text-decoration:none; transition:.15s; }
.back-btn:hover { background:#3aa0ff; color:#fff; border-color:#3aa0ff; }
/* 57 个触发条件 chip grid */
.trigger-grid { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; margin-top:10px; }
.trigger-chip { display:flex; justify-content:space-between; align-items:center; gap:4px; font-size:10px; font-family:Consolas,monospace; background:#262b36; border:1px solid #2b303c; border-radius:6px; padding:4px 6px; color:#9aa2b1; min-width:0; }
.trigger-chip .t-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.trigger-chip .t-count { color:#9aa2b1; }
.trigger-chip.fired { background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.4); color:#4ade80; }
.trigger-chip.fired .t-count { color:#4ade80; font-weight:600; }
/* 弹幕条件判定参数（全部输入，滚动查看） */
.params { max-height:320px; overflow:auto; margin-top:10px; }
.param-item { display:flex; gap:8px; padding:4px 0; font-size:11px; font-family:Consolas,monospace; border-bottom:1px solid #262b36; }
.param-item:last-child { border-bottom:none; }
.param-item .pk { color:#7fd4ff; flex:0 0 42%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.param-item .pv { color:#9aa2b1; flex:1; word-break:break-all; }
</style>
</head>
<body>
<div class="wrap">
    <div style="margin-bottom:12px"><a class="back-btn" href="index.html">← 返回</a></div>
    <h1>STS2 游戏状态监控</h1>
    <p class="sub">当前游戏信息 + 57 个弹幕触发条件实时触发计数（SSE 推送）</p>

    <div class="card">
        <div class="card-head">
            <span class="method-tag tag-shell">监控</span>
            <h3>当前游戏信息状态</h3>
            <span id="status-live" class="method-tag tag-qt">等待数据…</span>
        </div>
        <div class="item"><span class="k">概要</span><span class="v dim" id="status-summary">—</span></div>
        <div id="game-info"></div>
        <div class="item"><span class="k">最后更新</span><span class="v" id="status-updated">—</span></div>
        <div class="hint" id="status-hint">打开本页后等待 1-5 秒：服务端在每次状态刷新或触发弹幕规则时推送实时数据。仅弹幕（danmu）会滚动显示，本监控数据按 type 过滤。触发过的条件会变绿并计数。</div>
        <div id="trigger-grid" class="trigger-grid"></div>
    </div>

    <div class="card">
        <div class="card-head">
            <span class="method-tag tag-shell">判定</span>
            <h3>弹幕条件判定参数</h3>
        </div>
        <div class="hint">弹幕规则判定的全部输入参数（特征 + tracker 内部计数），随状态刷新滚动展示。</div>
        <div id="params" class="params"></div>
    </div>
</div>

<script src="monitor.js"></script>
</body>
</html>
