<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NekoSpire · 策略网络</title><link rel="stylesheet" href="ui.css?v=20261128-coop-direct"><script src="ui.js?v=20261128-coop-direct" defer></script><script src="policy.js?v=20261128-coop-direct" defer></script></head>
<body><div class="wrap"><header class="masthead" id="masthead"></header><main>
<div class="page-heading"><div><div class="eyebrow">NEURAL ARCHIVE / 策略网络</div><h1>选择你的同行者。</h1><p class="sub">一位角色，一个专属策略网络。下载模型，让它参与出牌、选路与奖励选择。</p></div><span class="chapter" aria-hidden="true">02</span></div>
<div class="section-head"><h2>角色档案</h2><span id="model-count">连接档案中…</span></div>
<div class="roster" id="cards" aria-label="选择角色"><div class="loading-shimmer" style="width:100%">正在读取角色与模型状态…</div></div>
<section class="model-detail" id="model-detail" aria-label="所选角色模型详情" hidden>
<div><div class="eyebrow" id="model-en"></div><h2 id="model-name"></h2><p id="model-desc"></p><span class="model-file" id="model-file"></span></div>
<div class="model-actions"><button class="primary" id="model-download">下载模型</button><button class="text-button danger" id="model-remove" hidden>删除模型</button></div>
<p id="model-status" aria-live="polite"></p><div class="bar" id="model-bar" role="progressbar" aria-label="模型下载进度" aria-valuemin="0" aria-valuemax="100" hidden><i></i></div><div class="err" id="model-error" role="alert" hidden></div>
</section>
<div class="policy-hint"><span>点击角色展开详情，不会自动下载</span><span>未下载或暂不可用时回退求解器与启发式</span><span>窄屏可左右滑动选人</span></div>
<section class="runtime-panel" id="runtime" aria-label="运行环境">
<div class="runtime-icon" aria-hidden="true">⌘</div><div><h3>推理运行环境 <span class="badge" id="rt-badge">检查中</span></h3><div class="line" id="rt-line">Python 与 PyTorch · 打开页面后检查并补齐环境</div><div class="bar" id="rt-bar" role="progressbar" aria-label="环境准备进度" aria-valuemin="0" aria-valuemax="100" hidden><i></i></div><div class="err" id="rt-err" role="alert" hidden></div></div>
<button id="runtime-repair">检查 / 修复环境</button>
</section>
<div class="storage">本机存储位置 <span id="root">等待插件返回</span></div>
<div class="error-box" id="page-error" hidden><div class="err" id="page-err" role="alert"></div><button class="ghost" id="page-retry" style="margin-top:12px">重新连接插件</button></div>
</main><footer class="footer"><span>ALPHADEFECT / 每个角色，独立决策</span><span>游戏美术归原权利人所有 · 非官方插件</span></footer></div></body></html>
